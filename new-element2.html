<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书展销 - 分类展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #f9f7f4;
            color: #5a5a5a;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 50px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .category-title {
            font-size: 24px;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8e8e8;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .book-card {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .book-cover {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            padding: 15px;
        }

        .book-cover img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .book-info {
            padding: 15px;
            text-align: center;
        }

        .book-name {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .book-price {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
        }

        .book-discount {
            background-color: #d9534f;
            color: #ffffff;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .book-cover {
                height: 200px;
            }

            .category-section {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .book-cover {
                height: 180px;
            }

            .book-name {
                font-size: 13px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 文学分类 -->
        <section class="category-section">
            <h2 class="category-title">【文学】</h2>
            <div class="books-grid">
                <div class="book-card">
                    <div class="book-cover">
                        <img src="/img/19.jpg" alt="图书封面">
                    </div>
                    <div class="book-info">
                        <div class="book-name">瓦尔登湖</div>
                        <div class="book-price">定价：￥55.00</div>
                        <div class="book-discount">批发折扣：65.00%</div>
                    </div>
                </div>

                <div class="book-card">
                    <div class="book-cover">
                        <img src="/img/20.jpg" alt="图书封面">
                    </div>
                    <div class="book-info">
                        <div class="book-name">三生三世十里桃花</div>
                        <div class="book-price">定价：￥35.00</div>
                        <div class="book-discount">批发折扣：70.00%</div>
                    </div>
                </div>

                <div class="book-card">
                    <div class="book-cover">
                        <img src="/img/21.jpg" alt="图书封面">
                    </div>
                    <div class="book-info">
                        <div class="book-name">诗词若干首:唐宋明朝诗人咏四</div>
                        <div class="book-price">定价：￥39.00</div>
                        <div class="book-discount">批发折扣：68.00%</div>
                    </div>
                </div>

                <div class="book-card">
                    <div class="book-cover">
                        <img src="/img/22.jpg" alt="图书封面">
                    </div>
                    <div class="book-info">
                        <div class="book-name">孤独与疯狂 梵·高</div>
                        <div class="book-price">定价：￥59.80</div>
                        <div class="book-discount">批发折扣：62.00%</div>
                    </div>
                </div>

                <div class="book-card">
                    <div class="book-cover">
                        <img src="/img/23.jpg" alt="图书封面">
                    </div>
                    <div class="book-info">
                        <div class="book-name">嘘,埃尔伯特</div>
                        <div class="book-price">定价：￥75.00</div>
                        <div class="book-discount">批发折扣：66.00%</div>
                    </div>
                </div>

            </div>
        </section>
    </div>
</body>
</html>
