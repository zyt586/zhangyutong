<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zyt 图书搜索</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #f5f3ef;
        color: #333;
      }

      .zyt_page {
        width: 1220px;
        margin: 30px auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 26px rgba(62, 36, 29, 0.08);
        overflow: hidden;
      }

      .zyt_header {
        background: linear-gradient(180deg, #fffaf8 0%, #fff 100%);
        border-bottom: 1px solid #f5e9e3;
        padding: 18px 30px 22px;
      }

      .zyt_topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .zyt_brandWrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .zyt_logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ff6464 0%, #d92d2d 100%);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .zyt_brand {
        color: #d63b3b;
        font-size: 18px;
        font-weight: 700;
      }

      .zyt_nav {
        display: flex;
        align-items: center;
        gap: 26px;
        color: #666;
        font-size: 14px;
      }

      .zyt_nav span {
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .zyt_nav span.active,
      .zyt_nav span:hover {
        color: #d63b3b;
      }

      .zyt_user {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #666;
        font-size: 14px;
      }

      .zyt_userBadge {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #f3e5e1;
        color: #d63b3b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }

      .zyt_searchBar {
        display: flex;
        align-items: stretch;
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        border: 2px solid #ff1c1c;
        background: #fff;
        overflow: hidden;
        box-shadow: none;
      }

      .zyt_searchInputWrap {
        flex: 1;
        min-width: 0;
        background: #fff;
      }

      .zyt_searchInput {
        width: 100%;
        height: 58px;
        border: none;
        outline: none;
        background: #fff;
        color: #333;
        font-size: 16px;
        padding: 0 18px;
      }

      .zyt_searchInput::placeholder {
        color: #b1b1b1;
      }

      .zyt_searchSelectWrap {
        position: relative;
        width: 180px;
        border-left: 2px solid #ff1c1c;
        background: #fff;
      }

      .zyt_searchSelect {
        width: 100%;
        height: 58px;
        padding: 0 42px 0 18px;
        border: none;
        outline: none;
        background: #fff;
        color: #3b3b3b;
        font-size: 15px;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
      }

      .zyt_selectArrow {
        position: absolute;
        right: 14px;
        top: 50%;
        color: #8e8e8e;
        transform: translateY(-50%);
        pointer-events: none;
        font-size: 14px;
      }

      .zyt_searchBtn {
        width: 145px;
        border: none;
        background: #ff1c1c;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: filter 0.2s ease, transform 0.2s ease;
      }

      .zyt_searchBtn:hover {
        filter: brightness(1.03);
      }

      .zyt_searchBtn:active {
        transform: translateY(1px);
      }

      .zyt_main {
        padding: 24px 30px 36px;
      }

      .zyt_resultBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: #fff8f5;
        border: 1px solid #f7e5df;
        border-radius: 12px;
        padding: 14px 18px;
        color: #666;
        font-size: 14px;
      }

      .zyt_resultValue {
        color: #d63b3b;
        font-weight: 700;
      }

      .zyt_bookGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 22px;
        margin-top: 24px;
      }

      .zyt_bookCard {
        background: #fff;
        border: 1px solid #f1ece7;
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .zyt_bookCard:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
      }

      .zyt_cover {
        width: 100%;
        height: 220px;
        background: #f8f4f1;
      }

      .zyt_cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .zyt_bookInfo {
        padding: 14px 14px 18px;
      }

      .zyt_bookTitle {
        color: #2d2d2d;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .zyt_bookMeta {
        color: #8b8b8b;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .zyt_priceRow {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .zyt_price {
        color: #de2d2d;
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
      }

      .zyt_oldPrice {
        color: #b6b6b6;
        font-size: 12px;
        text-decoration: line-through;
      }

      @media (max-width: 900px) {
        .zyt_page {
          width: calc(100% - 20px);
          margin: 20px auto;
        }

        .zyt_topbar {
          flex-wrap: wrap;
          gap: 12px;
        }

        .zyt_nav {
          order: 3;
          width: 100%;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 10px 16px;
        }

        .zyt_searchBar {
          flex-wrap: wrap;
        }

        .zyt_searchInputWrap,
        .zyt_searchSelectWrap,
        .zyt_searchBtn {
          width: 100%;
        }

        .zyt_searchSelectWrap {
          border-left: none;
          border-top: 2px solid #ff1c1c;
        }
      }
    </style>
  </head>
  <body>
    <div id="zyt_app" class="zyt_page">
      <header class="zyt_header">
        <div class="zyt_topbar">
          <div class="zyt_brandWrap">
            <div class="zyt_logo">书</div>
            <div class="zyt_brand">书海藏阁</div>
          </div>

          <nav class="zyt_nav">
            <span class="active">首页</span>
            <span>分类</span>
            <span>榜单</span>
            <span>新书</span>
            <span>活动</span>
          </nav>

          <div class="zyt_user">
            <span class="zyt_userBadge">U</span>
            <span>登录</span>
          </div>
        </div>

        <div class="zyt_searchBar">
          <div class="zyt_searchInputWrap">
            <input
              v-model="zyt_keyword"
              class="zyt_searchInput"
              type="text"
              placeholder="搜索图书、作者、关键词"
              @keyup.enter="zyt_runSearch"
            />
          </div>

          <div class="zyt_searchSelectWrap">
            <select v-model="zyt_scope" class="zyt_searchSelect">
              <option value="all">搜索全部</option>
              <option value="title">按书名</option>
              <option value="author">按作者</option>
              <option value="category">按分类</option>
            </select>
            <span class="zyt_selectArrow">▾</span>
          </div>

          <button class="zyt_searchBtn" type="button" @click="zyt_runSearch">搜索</button>
        </div>
      </header>

      <main class="zyt_main">
        <div class="zyt_resultBar">
          <span>搜索范围：<span class="zyt_resultValue">{{ zyt_scopeText }}</span></span>
          <span>关键词：<span class="zyt_resultValue">{{ zyt_lastKeyword || '全部图书' }}</span></span>
        </div>

        <div class="zyt_bookGrid">
          <article v-for="book in zyt_resultList" :key="book.id" class="zyt_bookCard">
            <div class="zyt_cover">
              <img :src="book.cover" :alt="book.title" />
            </div>
            <div class="zyt_bookInfo">
              <div class="zyt_bookTitle">{{ book.title }}</div>
              <div class="zyt_bookMeta">{{ book.author }} · {{ book.category }}</div>
              <div class="zyt_priceRow">
                <span class="zyt_price">¥{{ book.price }}</span>
                <span class="zyt_oldPrice">¥{{ book.oldPrice }}</span>
              </div>
            </div>
          </article>
        </div>
      </main>
    </div>

    <script src="./node_modules/vue/dist/vue.global.prod.js"></script>
    <script>
      const { createApp, ref, computed } = Vue;

      createApp({
        setup() {
          const zyt_books = ref([
            { id: 1, title: '活着', author: '余华', category: '文学', price: 32, oldPrice: 46, cover: 'img/22.jpg' },
            { id: 2, title: '白夜行', author: '东野圭吾', category: '悬疑', price: 39, oldPrice: 58, cover: 'img/19.jpg' },
            { id: 3, title: '海边的卡夫卡', author: '村上春树', category: '文学', price: 45, oldPrice: 66, cover: 'img/24.jpg' },
            { id: 4, title: '孩子你慢慢来', author: '龙应台', category: '教育', price: 28, oldPrice: 42, cover: 'img/25.jpg' },
            { id: 5, title: '解忧杂货店', author: '东野圭吾', category: '小说', price: 34, oldPrice: 49, cover: 'img/28.jpg' },
            { id: 6, title: '我与世界只差一个你', author: '赵一曼', category: '青春', price: 26, oldPrice: 38, cover: 'img/23.jpg' }
          ]);

          const zyt_keyword = ref('');
          const zyt_scope = ref('all');
          const zyt_lastKeyword = ref('');

          const zyt_scopeText = computed(() => {
            const map = {
              all: '搜索全部',
              title: '按书名',
              author: '按作者',
              category: '按分类'
            };
            return map[zyt_scope.value] || '搜索全部';
          });

          const zyt_resultList = computed(() => {
            const keyword = zyt_keyword.value.trim().toLowerCase();
            if (!keyword) {
              return zyt_books.value;
            }

            return zyt_books.value.filter((item) => {
              const scopeKey = zyt_scope.value;
              const source = {
                all: [item.title, item.author, item.category].join(' '),
                title: item.title,
                author: item.author,
                category: item.category
              }[scopeKey] || [item.title, item.author, item.category].join(' ');

              return source.toLowerCase().includes(keyword);
            });
          });

          const zyt_runSearch = () => {
            zyt_lastKeyword.value = zyt_keyword.value.trim() || '全部图书';
          };

          return {
            zyt_keyword,
            zyt_scope,
            zyt_scopeText,
            zyt_lastKeyword,
            zyt_resultList,
            zyt_runSearch
          };
        }
      }).mount('#zyt_app');
    </script>
  </body>
</html>
