<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒模型、框模型、box model</title>
  <style>
    *{
      box-sizing: border-box;
    }
    /* 尽量不用通配符 */
    body,u1,p,h1,h2,h3,h4,h5,h6{ 
      margin: 0;
      padding: 0;
    }
    .a{
      width: 500px;
      height: 300px;
      border: 2px dotted #039;
      padding: 70px 60px 50px 40px; /*上右下左*/
      margin: 40px auto;
      /* 上下、左右、左右margin 为auto则盒子居中*/ 
    }
    /*盒子的高度：内容的高度+上下padding+上下border+上下margin*/
    .b{
      width: 500px;
      height: 300px;
      border: 2px dotted #039;
      margin: 40px auto 50px;
      /* 上、左右、下*/ 
    }
    .c{
      width:500px;
      height: 300px;
      border: 2px solid #039;
      margin: 40px auto 40px;
    }

  </style>
</head>
<body>
  <div class="a">830张语桐</div>
  <div class="b">830张语桐</div>
  <div class="c">830张语桐</div>

</body>
</html>
