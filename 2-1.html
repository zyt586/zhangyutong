<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>张语桐</title>
</head>
<body>
  <h2>HTML元素：开始标签+内容+结束标签</h2>

  <h3>内容与样式相分离-语义性</h3>
  <h4>山居秋暝</h4>
  空山新雨后<br>
  天气晚来秋</br>
  <p>明月松间照</p>
  <p>清泉石上流</p>
  <h4>93阅兵展示的武器列表</h4>
  <ul>
<!-- <li>：列表项元素 -->
    <li>东方</li>
    <li>鹰击</li>
    <li>长缨</li>
    <ul>
    <li>巨浪</li>
    <ul>
    <li>霹雳</li>
    </ul>
    </ul>
  </ul>
  <ul>
  <li>Milk</li>
  <li>
    Cheese
    <ul>
      <li>Blue cheese</li>
      <li>Feta</li>
    </ul>
  </li>
</ul>
  <!-- 区域，块 -->
   <div style="background-color: #d85656;width: 400px;height: 400px;"> 
    盒子
    <dir> 
      <span style="color: #64a8db;font-size: 100px;">张</span>
      <!-- 行间元素，可以和其他行间元素在同一行显示 -->
      <span style="color: #f1d477;font-size: 100px;">语</span>
      <span style="color: #cb17d1;font-size: 100px;">桐</span>
    </dir>
   </div>
</body>
</html>
