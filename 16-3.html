<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16-3 抖音精选 · 视频卡片墙</title>
  <!--
  姓名：张语桐
  日期：2026-10-29
  功能名称：抖音精选视频卡片墙——深色主题分类导航 + 视频卡片网格，分类可筛选
  -->
  <link rel="stylesheet" href="font/iconfont.css">
  <style>
    :root {
      --zyt_bg: #111214;
      --zyt_card: #1e1f22;
      --zyt_text: #f1f1f1;
      --zyt_muted: #8a8a8a;
      --zyt_line: #2a2b2e;
      --zyt_red: #fe2c55;
      --zyt_scrim: rgba(0, 0, 0, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background-color: var(--zyt_bg);
      color: var(--zyt_text);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    /* ---------- 顶部分类导航 ---------- */
    .zyt_nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--zyt_bg);
      padding: 14px 24px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .zyt_nav::-webkit-scrollbar {
      display: none;
    }

    .zyt_tab {
      flex: 0 0 auto;
      padding: 5px 14px;
      border: none;
      border-radius: 8px;
      background-color: transparent;
      color: #b3b3b3;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .zyt_tab:hover {
      color: #fff;
    }

    .zyt_tab.zyt_tabActive {
      background-color: #fff;
      color: #111;
      font-weight: 700;
    }

    /* ---------- 视频卡片网格 ---------- */
    .zyt_main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 6px 24px 0;
    }

    .zyt_grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 16px;
    }

    .zyt_vcard {
      cursor: pointer;
    }

    .zyt_vthumb {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background-color: var(--zyt_card);
    }

    .zyt_vthumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .zyt_vcard:hover .zyt_vthumb img {
      transform: scale(1.06);
    }

    .zyt_vcover {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.62) 100%);
      pointer-events: none;
    }

    /* 封面上的大字（模仿视频封面标题） */
    .zyt_vbig {
      position: absolute;
      left: 12px;
      bottom: 34px;
      right: 12px;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .zyt_vbig.zyt_sizeLg { font-size: 22px; letter-spacing: 1px; }
    .zyt_vbig.zyt_sizeMd { font-size: 17px; }
    .zyt_vbig .zyt_bigRed { color: #ffd21e; }
    .zyt_vbig .zyt_bigQuote { color: #ff5d5d; }

    .zyt_vlike {
      position: absolute;
      left: 10px;
      bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 12px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .zyt_vlike .iconfont {
      font-size: 14px;
    }

    .zyt_vdur {
      position: absolute;
      right: 10px;
      bottom: 8px;
      color: #fff;
      font-size: 12px;
      font-family: Arial, sans-serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* ---------- 卡片文字区 ---------- */
    .zyt_vinfo {
      padding: 10px 2px 0;
    }

    .zyt_vtitle {
      font-size: 14px;
      line-height: 1.5;
      color: var(--zyt_text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .zyt_vtags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .zyt_vtag {
      padding: 3px 10px;
      border-radius: 6px;
      background-color: var(--zyt_card);
      border: 1px solid var(--zyt_line);
      color: #d0d0d0;
      font-size: 12px;
    }

    .zyt_vmeta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      font-size: 12px;
      color: var(--zyt_muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .zyt_vmeta .zyt_metaAuthor {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .zyt_liveBadge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 7px;
      border-radius: 999px;
      background-color: var(--zyt_red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .zyt_emptyTip {
      display: none;
      padding: 60px 0;
      text-align: center;
      color: var(--zyt_muted);
      font-size: 14px;
    }

    .zyt_emptyTip.zyt_show {
      display: block;
    }

    .zyt_foot {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #5c5c5c;
    }

    @media (max-width: 1024px) {
      .zyt_grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .zyt_grid { grid-template-columns: repeat(2, 1fr); gap: 14px 10px; }
      .zyt_nav { padding: 12px 14px 10px; }
      .zyt_main { padding: 4px 14px 0; }
      .zyt_title { font-size: 20px; }
    }

    @media (max-width: 420px) {
      .zyt_grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    // ---------- 渲染卡片 ----------
    const zyt_grid = document.querySelector('.zyt_grid');
    const zyt_emptyTip = document.querySelector('.zyt_emptyTip');

    function zyt_buildCard(zyt_v) {
      const zyt_bigHtml = zyt_v.zyt_big
        ? '<div class="zyt_vbig ' + zyt_v.zyt_bigCls + '">' + zyt_v.zyt_big + '</div>'
        : '';

      const zyt_tagsHtml = zyt_v.zyt_tags.length
        ? '<div class="zyt_vtags">' +
            zyt_v.zyt_tags.map(function (zyt_t) {
              return '<span class="zyt_vtag">' + zyt_t + '</span>';
            }).join('') +
          '</div>'
        : '';

      const zyt_liveHtml = zyt_v.zyt_live
        ? '<span class="zyt_liveBadge">正在直播</span>'
        : '';

      return '<article class="zyt_vcard" data-zyt-cat="' + zyt_v.zyt_cat + '">' +
          '<div class="zyt_vthumb">' +
            '<img src="' + zyt_v.zyt_img + '" alt="' + zyt_v.zyt_title + '" loading="lazy">' +
            '<div class="zyt_vcover"></div>' +
            zyt_bigHtml +
            '<span class="zyt_vlike"><i class="iconfont icon-shoucang"></i>' + zyt_v.zyt_like + '</span>' +
            '<span class="zyt_vdur">' + zyt_v.zyt_dur + '</span>' +
          '</div>' +
          '<div class="zyt_vinfo">' +
            '<p class="zyt_vtitle">' + zyt_v.zyt_title + '</p>' +
            zyt_tagsHtml +
            '<div class="zyt_vmeta">' +
              '<span class="zyt_metaAuthor">@' + zyt_v.zyt_author + '</span>' +
              '<span>·</span>' +
              '<span>' + zyt_v.zyt_date + '</span>' +
              zyt_liveHtml +
            '</div>' +
          '</div>' +
        '</article>';
    }

    zyt_grid.innerHTML = zyt_videos.map(zyt_buildCard).join('');

    // ---------- 分类筛选 ----------
    const zyt_tabs = document.querySelectorAll('.zyt_tab');

    zyt_tabs.forEach(function (zyt_tab) {
      zyt_tab.addEventListener('click', function () {
        // 切换高亮
        zyt_tabs.forEach(function (zyt_t) { zyt_t.classList.remove('zyt_tabActive'); });
        zyt_tab.classList.add('zyt_tabActive');

        // 筛选卡片
        const zyt_cat = zyt_tab.getAttribute('data-zyt-cat');
        let zyt_visible = 0;
        zyt_grid.querySelectorAll('.zyt_vcard').forEach(function (zyt_card) {
          const zyt_show = zyt_cat === 'all' || zyt_card.getAttribute('data-zyt-cat') === zyt_cat;
          zyt_card.style.display = zyt_show ? '' : 'none';
          if (zyt_show) zyt_visible++;
        });

        zyt_emptyTip.className = 'zyt_emptyTip' + (zyt_visible === 0 ? ' zyt_show' : '');
      });
    });
  </script>
</body>
