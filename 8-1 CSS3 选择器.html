<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css3</title>
  <style>
    .main{
      display: flex;
      flex-wrap: wrap;
      margin: 10px;
    }
    .box{
      width: 150px;
      height: 150px;
      border: 1px solid #ccc;
      margin: 10px;
      display: flex;
      /* 水平垂直居中对齐 */
      justify-content: center;
      align-items: center;
      font-size: 40px;
      transition: all 0.6s;
      box-sizing: border-box;
      /* width :包含padding和border*/
    }
    .box:first-child:hover{
      background-color: red;
      color: #fff; 
      font-size:140px;
    }
    .box:nth-child(2):hover{
      border-radius: 50%;
      border-width: 10px;
    }
    .box:nth-child(3):hover{
      box-shadow: 10px 10px 10px red;
    }
    .box:nth-of-type(4):hover{
      text-shadow: 100px 10px 10px #ccc;
    }
    .box:nth-of-type(5):hover{
      /* 线性渐变 */
      background: linear-gradient(to right, red, yellow, green, blue, purple, pink, orange, red);
    }
    .box:nth-of-type(5)+.box{
      /* 径向渐变 */
      background: radial-gradient(circle, red, yellow, red);
    }
    /* 相邻兄弟选择器 
    +后面的那个兄弟
    ~后面的所有兄弟*/
    .box:nth-of-type(7):hover{
        transform: scale(0.5);
    }
    .box:nth-child(8):hover{
      transform: translateX(-150px);
    }
    .box:nth-child(9):hover{
      transform: rotateZ(-180deg);
    }
    .box:nth-child(10):hover{
      transform: skewX(20deg) translateY(50px);
    }
    .box:nth-last-child(2):hover::before{
      /* 内部的最前面的元素 */
      content: "*";
      color: red;
    }
    /* 扩展：第12个盒子，鼠标在上面时显示自己的名字，要求名字深色背景白色文字，
    水平垂直居中 */
    .box:nth-of-type(12){
      position: relative;
      overflow: visible;
    }
    .box:nth-of-type(12):hover::after{
      content: "张语桐";
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 12px 24px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.6);
      letter-spacing: 3px;
      white-space: nowrap;
      z-index: 10;
    }
    .box:nth-of-type(3n):hover::after{
      border: 3px solid red;
    }
    /* 偶数：even, 奇数：odd */
    /* 扩展2：鼠标在偶数个盒子上时候，自定义效果 */
    
    .box:nth-child(even):hover{
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      transform: scale(1.1) rotateZ(5deg);
      box-shadow: 0 15px 30px rgba(245, 87, 108, 0.4),
                  0 5px 15px rgba(240, 147, 251, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.8);
      font-size: 50px;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>
    <div class="box">10</div>
    <div class="box">11</div>
    <div class="box">12</div>

  </div>
</body>
</html>
