<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>830张语桐</title>
  <style>
    h2{
      background-color: black;
      color: white;
    }
    h3{
        color: white;
    }
    p{
      color: blue;
    }
    /* 标签选择器，选择器名称为标签名 */
    #box{
      width: 500px;
      height: 500px;
      background-color: #ccc;
    }
    .box2{
      width: 500px;
      height: 500px;  
      background-color: #c31b1b;
    }
    /* id选择器，以#开始，唯一 */
    .n1{
      color: green;
    }
    .n2{
      color: red;
    }
    .n3{
      color: blue;
    }
  </style>
</head>
<body>
  <h2>层叠样式表css</h2>
  <div id="box">
    <h3>css选择器</h3>
    <span class="n1">张</span>
    <span class="n2">语</span>
    <span class="n3">桐</span>
    <p>css属性</p>
  </div>
  <!-- 扩展：1、h2黑底白字 -->
  <!-- 2、你的名字每个字颜色不同 -->
  <!-- 3、选择器三个字白色 -->
  <!-- 4、新加一个盒子，盒子里面的文字是你的学号，盒子有宽高背景 -->
   <div class="box2">
    24001010830
   </div>
</body>
</html>
