<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图书榜单</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f2ee;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #333;
    }

    .page {
      width: 1200px;
      margin: 36px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(112, 77, 67, 0.07);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 28px;
      height: 80px;
      padding: 0 28px;
      border-bottom: 1px solid #f0eee8;
      background: #fff;
    }

    .tab {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      font-size: 18px;
      color: #4b4b4b;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .tab.active {
      color: #d92d2d;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #d92d2d;
      border-radius: 3px 3px 0 0;
    }

    .tab:hover {
      color: #d92d2d;
    }

    .content {
      padding: 26px 22px 34px;
      background: #fff;
    }

    .book-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px 18px;
    }

    .hot-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .feature-book {
      display: flex;
      align-items: stretch;
      background: #fff;
      border: 1px solid #f1e8e1;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(100, 74, 68, 0.04);
    }

    .feature-cover {
      position: relative;
      width: 245px;
      min-width: 245px;
      height: 270px;
      background: #f9f5f1;
    }

    .feature-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .feature-body {
      flex: 1;
      padding: 20px 22px 18px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .feature-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .feature-title {
      font-size: 28px;
      color: #2d2d2d;
      font-weight: 700;
      line-height: 1.3;
    }

    .feature-book .promo-badge {
      position: static;
      display: inline-block;
      margin-left: 4px;
      box-shadow: none;
      border-radius: 10px;
    }

    .feature-desc {
      color: #7e7e7e;
      font-size: 15px;
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .feature-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #8f8f8f;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .feature-meta .stars {
      font-size: 16px;
    }

    .feature-price-box {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .feature-price-box .current-price {
      font-size: 34px;
    }

    .feature-price-box .old-price {
      font-size: 15px;
    }

    .mini-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .mini-card {
      position: relative;
      width: 214px;
      background: #fff;
      border: 1px solid #f2ece7;
      border-radius: 16px;
      padding: 12px 12px 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .mini-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.04);
    }

    .book-card,
    .mini-card {
      position: relative;
      background: #fff;
      border: 1px solid #f2ece7;
      border-radius: 16px;
      padding: 14px 14px 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .book-card:hover,
    .mini-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.04);
    }

    .book-card {
      width: 224px;
    }

    .cover-wrap {
      position: relative;
      width: 100%;
      height: 222px;
      border-radius: 12px;
      overflow: hidden;
      background: #f9f5f1;
    }

    .mini-card .cover-wrap {
      height: 200px;
    }

    .cover-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .promo-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #ff5b5b, #df2929);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      padding: 8px 10px;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 0 6px 12px rgba(217, 37, 37, 0.18);
      z-index: 2;
    }

    .card-tag {
      position: absolute;
      left: 14px;
      bottom: 10px;
      background: #f9d96d;
      color: #8f5a00;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      z-index: 2;
    }

    .book-info {
      padding-top: 14px;
    }

    .book-title {
      font-size: 18px;
      line-height: 1.45;
      color: #2f2f2f;
      font-weight: 700;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-desc {
      color: #a0a0a0;
      font-size: 12px;
      line-height: 1.5;
      min-height: 36px;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #9e9e9e;
      font-size: 12px;
    }

    .stars {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      letter-spacing: 1px;
      color: #ffb11d;
      font-size: 13px;
    }

    .stars .off {
      color: #d7d7d7;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .price-label {
      font-size: 12px;
      color: #999;
      margin-right: 2px;
    }

    .current-price {
      color: #e43939;
      font-weight: 700;
      font-size: 26px;
      line-height: 1;
    }

    .old-price {
      font-size: 12px;
      color: #b4b4b4;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    @media (max-width: 1280px) {
      .page {
        width: calc(100% - 32px);
      }
    }

    @media (max-width: 760px) {
      .tabs {
        justify-content: space-between;
        gap: 12px;
        padding: 0 16px;
      }

      .tab {
        font-size: 16px;
        padding: 0 8px;
      }

      .book-grid {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

    const tabs = [
      { id: 'new', label: '新品特惠' },

    ];

    const tabsEl = document.getElementById('tabs');
    const gridEl = document.getElementById('bookGrid');

    function renderStars(rating) {
      const full = Math.round(rating);
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += `<span class="${i <= full ? '' : 'off'}">★</span>`;
      }
      return stars;
    }

    function renderPromoCard(item) {
      const starHtml = renderStars(item.rating);
      return `
        <article class="book-card">
          <div class="cover-wrap">
            <img src="${item.cover}" alt="${item.title}" />
            <span class="promo-badge">${item.badge}</span>
            ${item.tag ? `<span class="card-tag">${item.tag}</span>` : ''}
          </div>
          <div class="book-info">
            <div class="book-title">${item.title}</div>
            <div class="book-desc">${item.desc || ''}</div>
            <div class="rating-row">
              <span class="stars">${starHtml}</span>
              <span>${item.rating.toFixed(1)}</span>
              <span>(${item.reviews})</span>
            </div>
            <div class="price-box">
              <span class="price-label">预估到手价</span>
              <span class="current-price">¥${item.current}</span>
              <span class="old-price">¥${item.old}</span>
            </div>
          </div>
        </article>
      `;
    }

    function renderHotTab() {
      const feature = bookData.hot.feature;
      const list = bookData.hot.list;
      const featureStars = renderStars(feature.rating);

      gridEl.innerHTML = `
        <div class="hot-layout">
          <article class="feature-book">
            <div class="feature-cover">
              <img src="${feature.cover}" alt="${feature.title}" />
              <span class="promo-badge">${feature.badge}</span>
            </div>
            <div class="feature-body">
              <div class="feature-header">
                <h3 class="feature-title">${feature.title}</h3>
                <span class="promo-badge">${feature.badge}</span>
              </div>
              <div class="feature-desc">${feature.subtitle}</div>
              <div class="feature-meta">
                <span class="stars">${featureStars}</span>
                <span>${feature.rating.toFixed(1)}</span>
                <span>(${feature.reviews})</span>
              </div>
              <div class="feature-price-box">
                <span class="price-label">预估到手价</span>
                <span class="current-price">¥${feature.current}</span>
                <span class="old-price">¥${feature.old}</span>
              </div>
              <div class="feature-desc" style="margin-top: 16px; margin-bottom: 0;">${feature.intro}</div>
            </div>
          </article>

          <div class="mini-grid">
            ${list.map((item) => {
              const starHtml = renderStars(item.rating);
              return `
                <article class="mini-card">
                  <div class="cover-wrap">
                    <img src="${item.cover}" alt="${item.title}" />
                    <span class="promo-badge">${item.badge}</span>
                    ${item.tag ? `<span class="card-tag">${item.tag}</span>` : ''}
                  </div>
                  <div class="book-info">
                    <div class="book-title">${item.title}</div>
                    <div class="rating-row">
                      <span class="stars">${starHtml}</span>
                      <span>${item.rating.toFixed(1)}</span>
                      <span>(${item.reviews})</span>
                    </div>
                    <div class="price-box">
                      <span class="price-label">预估到手价</span>
                      <span class="current-price">¥${item.current}</span>
                      <span class="old-price">¥${item.old}</span>
                    </div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;

    function renderFeatureTab(tabId) {
      const section = bookData[tabId];
      if (!section) return;

      const feature = section.feature;
      const list = section.list;
      const featureStars = renderStars(feature.rating);

      gridEl.innerHTML = `
        <div class="hot-layout">
          <article class="feature-book">
            <div class="feature-cover">
              <img src="${feature.cover}" alt="${feature.title}" />
              <span class="promo-badge">${feature.badge}</span>
            </div>

              <div class="feature-header">
                <h3 class="feature-title">${feature.title}</h3>
                <span class="promo-badge">${feature.badge}</span>
              </div>
              <div class="feature-desc">${feature.subtitle}</div>
              <div class="feature-meta">
                <span class="stars">${featureStars}</span>
                <span>${feature.rating.toFixed(1)}</span>
                <span>(${feature.reviews})</span>
              </div>
              <div class="feature-price-box">

                <span class="old-price">¥${feature.old}</span>
              </div>
              <div class="feature-desc" style="margin-top: 16px; margin-bottom: 0;">${feature.intro}</div>
            </div>

          <div class="mini-grid">
            ${list.map((item) => {
              const starHtml = renderStars(item.rating);
              return `
                <article class="mini-card">
                  <div class="cover-wrap">
                    <img src="${item.cover}" alt="${item.title}" />
                    <span class="promo-badge">${item.badge}</span>
                    ${item.tag ? `<span class="card-tag">${item.tag}</span>` : ''}
                  </div>
                  <div class="book-info">
                    <div class="book-title">${item.title}</div>
                    <div class="rating-row">
                      <span class="stars">${starHtml}</span>
                      <span>${item.rating.toFixed(1)}</span>
                      <span>(${item.reviews})</span>
                    </div>
                    <div class="price-box">
                      <span class="price-label">预估到手价</span>
                      <span class="current-price">¥${item.current}</span>
                      <span class="old-price">¥${item.old}</span>
                    </div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderBooks(tabId) {
      if (tabId === 'hot' || tabId === 'new' || tabId === 'week') {
        renderFeatureTab(tabId);
        return;
      }
    }

    function setActiveTab(tabId) {
      document.querySelectorAll('.tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.id === tabId);
      });
      renderBooks(tabId);
    }

    tabsEl.innerHTML = tabs.map((tab) => `
      <div class="tab ${tab.id === 'new' ? 'active' : ''}" data-id="${tab.id}">${tab.label}</div>
    `).join('');

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => setActiveTab(tab.dataset.id));
    });

    renderBooks('new');
  </script>
</body>
